<!-- Google Search Console Verification -->
<meta name="google-site-verification" content="--ZM5HndYofgBG73cBqVhouaZsAsBUo0gbqi7ivD4lY" />

<!-- Google Tag Manager -->

new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=

<!-- SEO Meta Tags -->
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}">
<meta name="keywords" content="{{ with .Params.keywords }}{{ delimit . ", " }}{{ else }}{{ with .Site.Params.keywords }}{{ delimit . ", " }}{{ end }}{{ end }}">
<meta name="author" content="{{ .Site.Params.author.name }}">

<!-- Canonical URL -->
<link rel="canonical" href="{{ .Permalink }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ .Title }}{{ if not .IsHome }} | {{ .Site.Title }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:locale" content="{{ .Site.LanguageCode }}">
{{ with .Site.Params.images }}
<meta property="og:image" content="{{ index . 0 | absURL }}">
{{ end }}
{{ if .IsPage }}
{{ with .Date }}<meta property="article:published_time" content="{{ .Format "2006-01-02T15:04:05Z07:00" }}">{{ end }}
{{ with .Lastmod }}<meta property="article:modified_time" content="{{ .Format "2006-01-02T15:04:05Z07:00" }}">{{ end }}
{{ with .Site.Params.author.name }}<meta property="article:author" content="{{ . }}">{{ end }}
{{ end }}

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}{{ if not .IsHome }} | {{ .Site.Title }}{{ end }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}">
{{ with .Site.Params.images }}
<meta name="twitter:image" content="{{ index . 0 | absURL }}">
{{ end }}
{{ with .Site.Params.social.twitter }}
<meta name="twitter:site" content="@{{ . }}">
{{ end }}

<!-- JSON-LD Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  {{ if .IsHome }}
  "@type": "WebSite",
  "name": "{{ .Site.Title }}",
  "url": "{{ .Site.BaseURL }}",
  "description": "{{ .Site.Params.description }}",
  "inLanguage": "{{ .Site.LanguageCode }}",
  "publisher": {
    "@type": "Person",
    "name": "{{ .Site.Params.author.name }}"
  },
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{ .Site.BaseURL }}?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
  {{ else if .IsPage }}
  "@type": "Article",
  "headline": "{{ .Title }}",
  "url": "{{ .Permalink }}",
  "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}",
  "inLanguage": "{{ .Site.LanguageCode }}",
  {{ with .Site.Params.images }}"image": "{{ index . 0 | absURL }}",{{ end }}
  {{ with .Date }}"datePublished": "{{ .Format "2006-01-02T15:04:05Z07:00" }}",{{ end }}
  {{ with .Lastmod }}"dateModified": "{{ .Format "2006-01-02T15:04:05Z07:00" }}",{{ end }}
  "author": {
    "@type": "Person",
    "name": "{{ .Site.Params.author.name }}"
  },
  "publisher": {
    "@type": "Person",
    "name": "{{ .Site.Params.author.name }}"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  }
  {{ else }}
  "@type": "WebPage",
  "name": "{{ .Title }}",
  "url": "{{ .Permalink }}",
  "inLanguage": "{{ .Site.LanguageCode }}",
  "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}"
  {{ end }}
}
</script>

<!-- BreadcrumbList for hierarchical search results -->
{{ if not .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "{{ .Site.Title }}",
      "item": "{{ .Site.BaseURL }}"
    }
    {{- $position := 2 -}}
    {{- range .Ancestors.Reverse -}}
    {{- if not .IsHome -}}
    ,{
      "@type": "ListItem",
      "position": {{ $position }},
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }
    {{- $position = add $position 1 -}}
    {{- end -}}
    {{- end -}}
    ,{
      "@type": "ListItem",
      "position": {{ $position }},
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }
  ]
}
</script>
{{ end }}

<!-- Mermaid styling (theme handles loading) -->
<style>
  .mermaid {
    text-align: center;
    margin: 1.5rem 0;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
  }

  /* =============================================
     모바일 Header 크기 최적화
     - 가독성 향상을 위해 모바일에서 Header 크기 축소
     - 테마 기본값: h1=2.5rem, h2=2.2rem (모바일에서도 동일)
     ============================================= */

  /* 태블릿 (768px 이하) */
  @media only screen and (max-width: 47.999rem) {
    /* h1은 테마에서 2.5rem으로 설정되어 있으므로 추가 축소 */
    #R-body-inner h1 {
      font-size: 1.875rem !important; /* 30px */
    }

    #R-body-inner h2,
    #R-body-inner .card-title {
      font-size: 1.5rem; /* 24px */
    }

    #R-body-inner h3 {
      font-size: 1.25rem; /* 20px */
    }

    #R-body-inner h4 {
      font-size: 1.125rem; /* 18px */
    }

    #R-body-inner h5 {
      font-size: 1rem; /* 16px */
    }

    #R-body-inner h6 {
      font-size: 0.9375rem; /* 15px */
    }

    /* 사이드바 메뉴 항목도 조정 */
    #R-sidebar .padding a {
      font-size: 0.9375rem;
    }
  }

  /* 소형 모바일 (480px 이하) */
  @media only screen and (max-width: 30rem) {
    #R-body-inner h1 {
      font-size: 1.625rem !important; /* 26px */
    }

    #R-body-inner h2,
    #R-body-inner .card-title {
      font-size: 1.375rem; /* 22px */
    }

    #R-body-inner h3 {
      font-size: 1.1875rem; /* 19px */
    }

    #R-body-inner h4 {
      font-size: 1.0625rem; /* 17px */
    }

    #R-body-inner h5 {
      font-size: 0.9375rem; /* 15px */
    }

    #R-body-inner h6 {
      font-size: 0.875rem; /* 14px */
    }
  }
</style>

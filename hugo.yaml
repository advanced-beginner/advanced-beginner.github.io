baseURL: https://advanced-beginner.github.io/
title: Advanced Beginner
theme: hugo-book

defaultContentLanguage: ko
defaultContentLanguageInSubdir: true

enableGitInfo: true
enableRobotsTXT: true
disablePathToLower: true

languages:
  ko:
    weight: 1
    languageName: 한국어
    languageCode: ko-KR
    contentDir: content/ko
    title: Advanced Beginner
    params:
      BookDateFormat: "2006년 1월 2일"
  en:
    weight: 2
    languageName: English
    languageCode: en-US
    contentDir: content/en
    title: Advanced Beginner
    params:
      description: "A practical guide to Kafka, DDD, and Scala for developers moving beyond tutorials. Learn the 'why' behind the 'how'."

markup:
  highlight:
    noClasses: false
    style: monokai
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4

outputs:
  home:
    - html
    - rss
  section:
    - html
    - rss
  page:
    - html

sitemap:
  changeFreq: weekly
  priority: 0.5
  filename: sitemap.xml

menu:
  after:
    - name: "GitHub"
      url: "https://github.com/advanced-beginner/advanced-beginner.github.io"
      weight: 10

googleAnalytics = "GTM-W4X7HKDD"
params:
  author:
    name: kimbenji
    email: d8lzz1gpw@mozmail.com

  # 사이트 기본 설명 (SEO)
  description: "Kafka, DDD, Scala, Spark를 처음 시작하는 개발자를 위한 한글 기술 가이드. 실습 중심의 튜토리얼과 Spring Boot 예제 코드를 제공합니다."
  keywords:
    - Kafka
    - Apache Kafka
    - DDD
    - Domain Driven Design
    - Scala
    - Apache Spark
    - Spring Boot
    - 한글 가이드
    - 튜토리얼
    - 기술 블로그

  # Open Graph / 소셜 미디어
  images:
    - /images/og-image.png

  # Hugo Book Theme 설정
  BookTheme: "light"
  BookToC: true
  BookSection: docs
  BookSearch: true
  BookComments: false
  BookPortableLinks: "warning"
  BookDateFormat: "2023-10-15"
  BookEditLink: "https://github.com/advanced-beginner/advanced-beginner.github.io/edit/main/{{ .Path }}"

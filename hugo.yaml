baseURL: https://advanced-beginner.github.io/
title: Advanced Beginner
theme: hugo-theme-relearn

defaultContentLanguage: ko
defaultContentLanguageInSubdir: true

enableGitInfo: true
enableRobotsTXT: true

languages:
  ko:
    weight: 1
    languageName: 한국어
    languageCode: ko-KR
    contentDir: content/ko
    title: Advanced Beginner
    params:
      landingPageName: "<i class='fas fa-home'></i> 홈"
  en:
    weight: 2
    languageName: English
    languageCode: en-US
    contentDir: content/en
    title: Advanced Beginner
    params:
      landingPageName: "<i class='fas fa-home'></i> Home"
      description: "A practical guide to Kafka, DDD, and Scala for developers moving beyond tutorials. Learn the 'why' behind the 'how'."

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - html
    - rss
    - sitemap
  section:
    - html
    - rss
  page:
    - html

sitemap:
  changeFreq: weekly
  priority: 0.5
  filename: sitemap.xml

params:
  author:
    name: kimbenji
    email: d8lzz1gpw@mozmail.com

  # 사이트 기본 설명 (SEO)
  description: "Kafka와 DDD를 처음 시작하는 개발자를 위한 한글 기술 가이드. 실습 중심의 튜토리얼과 Spring Boot 예제 코드를 제공합니다."
  keywords:
    - Kafka
    - Apache Kafka
    - DDD
    - Domain Driven Design
    - Spring Boot
    - 한글 가이드
    - 튜토리얼

  # Open Graph / 소셜 미디어
  images:
    - /images/og-image.png

  # Twitter Card
  social:
    twitter: ""

  hideAuthorEmail: true
  showVisitedLinks: true
  disableLandingPageButton: false

  themeVariant:
    - auto
    - relearn-light
    - relearn-dark

  mermaidInitialize: '{ "theme": "default" }'

  LastModFormat: ":date.2006-01-02"
